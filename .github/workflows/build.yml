name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npm i jspdf@2.5.1 pdfjs-dist@3.11.174 heic2any@0.0.4

          mkdir -p www/libs
          cp index.html www/index.html
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/libs/
          cp node_modules/pdfjs-dist/build/pdf.min.js www/libs/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/libs/
          cp node_modules/heic2any/dist/heic2any.min.js www/libs/

          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js|libs/jspdf.umd.min.js|g' www/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js|libs/pdf.min.js|g' www/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js|libs/pdf.worker.min.js|g' www/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js|libs/heic2any.min.js|g' www/index.html

          if grep -q "https://" www/index.html; then
            echo "Remaining external URLs:"; grep -n "https://" www/index.html; exit 1
          fi
          ls -la www/libs

          npx cap init Mandarina com.marouane.mandarine --web-dir www
          npx cap add android

          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          src = Image.open("icon.png").convert("RGBA")
          res = "android/app/src/main/res"
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, n in sizes.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              im = src.resize((n, n), Image.LANCZOS)
              im.save(f"{folder}/ic_launcher.png")
              im.save(f"{folder}/ic_launcher_round.png")
              im.save(f"{folder}/ic_launcher_foreground.png")
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          PY

          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mandarina.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mandarina-apk
          path: Mandarina.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mandarina v${{ github.run_number }}
          files: Mandarina.apk
