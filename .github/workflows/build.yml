name: Build Mandarina APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude 'android' --exclude 'www' --exclude 'assets' \
            --exclude 'package*.json' --exclude 'capacitor.config.*' \
            --exclude '*.yml' --exclude '*.md' \
            ./ www/
          ls -la www

      - name: Create Capacitor project
        run: |
          [ -f package.json ] || npm init -y
          npm install --no-audit --no-fund \
            @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
            @capacitor/filesystem@6 @capacitor/share@6
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.mandarina.app",
            "appName": "Mandarina",
            "webDir": "www",
            "backgroundColor": "#000000",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android

      - name: Black launcher icon and splash (optional)
        if: hashFiles('icon.svg') != ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          rsvg-convert -w 640 -h 640 icon.svg -o /tmp/fg.png
          convert -size 1024x1024 xc:none /tmp/fg.png -gravity center -composite assets/icon-foreground.png
          convert -size 1024x1024 xc:'#000000' assets/icon-background.png
          rsvg-convert -w 760 -h 760 icon.svg -o /tmp/sp.png
          convert -size 2732x2732 xc:'#000000' /tmp/sp.png -gravity center -composite assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx --yes @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' \
            --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Mandarina.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mandarina-apk
          path: Mandarina.apk

      # Optional: direct download link for your friends (Releases page).
      # Delete this step if you only want the zipped artifact.
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mandarina (dernière version)
          files: Mandarina.apk
